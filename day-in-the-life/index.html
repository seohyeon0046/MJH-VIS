<title>MJH Day in the Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
/* Layout: a faithful take on the FlowingData simulation. Narrow left column (clock, controls, running note), square chart on the right; activities on a circle, travel in the middle. */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --rule: #d9d9d9;
  --accent: #c0392b;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-note: "Nanum Myeongjo", "AppleMyungjo", Georgia, serif;
}
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); }
.wrap { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); gap: 24px; max-width: 1120px; margin: 0 auto; padding-block: 20px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.clock { font-family: var(--f-mono); font-weight: 300; font-size: clamp(40px, 6vw, 56px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 0.42em; margin-right: 6px; letter-spacing: 0; }
.scrub { display: flex; flex-direction: column; gap: 2px; }
#time { width: 100%; margin: 0; accent-color: var(--ink); cursor: ew-resize; }
#time:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#time { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; }
#time::-webkit-slider-runnable-track { height: 3px; background: var(--ink); }
#time::-moz-range-track { height: 3px; background: var(--ink); }
#time::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); margin-top: -5.5px; box-sizing: border-box; }
#time::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); box-sizing: border-box; }
/* ruler: hourly ticks, taller every 3 hours, labelled every 6; inset by half the thumb so ticks line up with it */
.ruler { position: relative; height: 24px; margin: 0 7px; }
.ruler .tk { position: absolute; top: 0; width: 1px; height: 4px; background: var(--muted); transform: translateX(-0.5px); }
.ruler .tk.mid { height: 7px; }
.ruler .tk.maj { height: 9px; background: var(--ink); }
.ruler .tl { position: absolute; top: 11px; transform: translateX(-50%); font: 10px/1 var(--f-mono); color: var(--muted); white-space: nowrap; }
.trend { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.trend-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; font-size: 11px; color: var(--muted); }
.trend-h b { font-weight: 600; }
.trend-h .lg { font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
.trend-h .lg i { display: inline-block; width: 16px; height: 0; border-top: 2px solid #FF7F00; vertical-align: middle; margin-right: 5px; }
.trend-h .lg i.dash { border-top: 2px dashed #9a9a9a; }
#trend { width: 100%; height: 64px; display: block; cursor: ew-resize; touch-action: none; }
.tog { display: inline-flex; border: 1px solid var(--ink); }
.tog button { font: 500 11px/1 var(--f-mono); letter-spacing: 0.06em; padding: 6px 9px; background: var(--paper); color: var(--ink); border: 0; border-right: 1px solid var(--ink); cursor: pointer; }
.tog button:last-child { border-right: 0; }
.tog button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tog button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.note { font-family: var(--f-note); font-size: 14px; line-height: 1.55; min-height: 3.2em; margin: 0; transition: opacity .6s, transform .6s; }
.botbox { display: flex; flex-direction: column; gap: 4px; }
.botbox svg { width: 100%; max-width: 260px; height: auto; display: block; }
.botbox svg * { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.botbox svg .thin { stroke-width: 1.2; stroke: var(--muted); }
.botbox svg .accent { stroke: #FF7F00; }
.botbox svg .fill { fill: var(--ink); stroke: none; }
.botbox svg .ant { fill: #FF7F00; stroke: none; }
.botbox svg .cone { fill: #FFB347; stroke: none; }
.botbox svg .fillsoft { fill: #FFE2B8; }
.botbox svg .screen { fill: #5C76EC; stroke: none; }
.botbox svg .zz { font: 600 14px var(--f-mono); fill: var(--ink); stroke: none; }
.note.out { opacity: 0; transform: translateY(12px); }
.about { font-size: 11px; line-height: 1.55; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; }
.about a { color: var(--accent); }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
.chart { position: relative; min-width: 0; }
#c { width: 100%; aspect-ratio: 1 / 1; display: block; max-width: 100%; }
@media (max-width: 720px) {
  .wrap { grid-template-columns: 1fr; gap: 12px; }
  .note { min-height: 3em; font-size: 13px; }
}
</style>
</head>

    tctx.font = '9px "IBM Plex Mono", ui-monospace, monospace'; tctx.fillStyle = '#6b6b6b';

    for (let i = 0; i <= 24; i += 6) { const x = L + i / 24 * (W - L - R); tctx.strokeStyle = 'rgba(0,0,0,0.07)'; tctx.beginPath(); tctx.moveTo(x, T); tctx.lineTo(x, H - Bm); tctx.stroke(); }
    tctx.textAlign = 'left'; tctx.textBaseline = 'bottom'; tctx.fillText(top + '%', L + 1, Y(top) - 1); tctx.textBaseline = 'middle';
    tctx.lineJoin = 'round'; tctx.lineCap = 'round'; tctx.lineWidth = 2;
    series.forEach((S) => { tctx.strokeStyle = COLOR[S.k]; tctx.beginPath(); S.v.forEach((v, s) => (s ? tctx.lineTo(X(s), Y(v)) : tctx.moveTo(X(s), Y(v)))); tctx.stroke(); });
    // now: a rule, a dot on each line and its value (labels kept apart)
    const s = Math.min(143, Math.floor(state.t / 10)), x = L + state.t / 1440 * (W - L - R);
    tctx.strokeStyle = 'rgba(0,0,0,0.55)'; tctx.lineWidth = 1; tctx.beginPath(); tctx.moveTo(x, T); tctx.lineTo(x, H - Bm); tctx.stroke();
    tctx.font = '600 10px "IBM Plex Mono", ui-monospace, monospace';
    const pts = series.map((S) => ({ k: S.k, val: S.v[s], y: Y(S.v[s]) })).sort((p, q) => p.y - q.y);
    for (let i = 1; i < pts.length; i++) if (pts[i].y - pts[i - 1].y < 11) pts[i].ly = pts[i - 1].ly !== undefined ? pts[i - 1].ly + 11 : pts[i - 1].y + 11;
    pts.forEach((p) => {
      tctx.fillStyle = COLOR[p.k]; tctx.beginPath(); tctx.arc(x, p.y, 3, 0, 6.2832); tctx.fill();
      const lbl = p.val.toFixed(1) + '%', right = x + 6 + tctx.measureText(lbl).width < W - R;
      tctx.textAlign = right ? 'left' : 'right'; tctx.fillText(lbl, right ? x + 6 : x - 6, Math.min(H - 4, Math.max(6, (p.ly ?? p.y) - (pts.length > 1 ? 0 : 8))));
    });
  }
  let tdrag = false;
  const trendTime = (e) => { const r = tr.getBoundingClientRect(); setTime(((e.clientX - r.left - 7) / (r.width - 14)) * 1440); };
  tr.addEventListener('pointerdown', (e) => { tdrag = true; dragging = true; tr.setPointerCapture(e.pointerId); trendTime(e); });
  tr.addEventListener('pointermove', (e) => { if (tdrag) trendTime(e); });
  tr.addEventListener('pointerup', () => { tdrag = false; dragging = false; });
  window.addEventListener('resize', () => { tr.width = 0; drawTrend(); });
  [dW, dE, gM, gS].forEach((b) => b.addEventListener('click', drawTrend));

  window.addEventListener('resize', resize);
  resize(); jumpTo(state.t); for (let i = 0; i < 60; i++) tick(1 / 60); updateAbout();
  let last = performance.now(), lastMin = -1;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state.playing) {
      state.t += dt * SPEEDS[state.speed];
      if (state.t >= 1440) { state.t -= 1440; for (let i = 0; i < n; i++) ptr[i] = 0; }
      advance(state.t);
    }
    tick(dt); draw();
    const m = Math.floor(state.t);
    if (m !== lastMin) { clockEl.innerHTML = clockText(state.t); lastMin = m; updateNote(); timeEl.value = m; drawTrend(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
